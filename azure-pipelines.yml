trigger:
  branches:
    include:
      - production

jobs:
- deployment: DeployProduction
  displayName: Deploy D365FO Middleware
  environment: Contabo Live Server

  strategy:
    runOnce:
      deploy:
        steps:
        - script: |
            set -e

            cd /home/deploy/apps/D365FOMiddleware_Nestbackend

            echo "Updating repository..."
            git fetch origin
            git checkout production
            git reset --hard origin/production

            echo "Ensuring D365FO production base URL..."
            if [ -f .env.production ]; then
              FO_URL='https://mesco.sandbox.operations.eu.dynamics.com'
              if grep -q '^D365FO_RESOURCE_PROD=' .env.production; then
                sed -i "s|^D365FO_RESOURCE_PROD=.*|D365FO_RESOURCE_PROD=${FO_URL}|" .env.production
              else
                echo "D365FO_RESOURCE_PROD=${FO_URL}" >> .env.production
              fi
              if grep -q '^D365FO_RESOURCE=' .env.production; then
                sed -i "s|^D365FO_RESOURCE=.*|D365FO_RESOURCE=${FO_URL}|" .env.production
              else
                echo "D365FO_RESOURCE=${FO_URL}" >> .env.production
              fi
            else
              echo "WARNING: .env.production not found; FO URL cannot be updated"
            fi

            echo "Building new image..."
            docker compose -f docker-compose.production.yml build app

            echo "Restarting application..."
            docker compose -f docker-compose.production.yml up -d app

            echo "Cleaning old images..."
            docker image prune -f

            echo "Deployment completed."
          displayName: Deploy Application