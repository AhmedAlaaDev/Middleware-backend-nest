# docker-compose.dev.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: d365fo-middleware-development
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - '${PORT:-3000}:3000'
    # Prefer IPv4 because some Docker hosts resolve Microsoft to IPv6 without an outbound IPv6 route.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Windows hosts maps onebox -> 127.0.0.1; from the container that must be the Docker host.
    extra_hosts:
      - 'usnconeboxax1aos.cloud.onebox.dynamics.com:host-gateway'
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
      # Named volume (not anonymous) so recreate/rebuild does not orphan node_modules copies
      - node_modules-dev:/app/node_modules
    networks:
      - mongodb_network
      - redis_network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
    command: sh -c "cd /app && pnpm start:dev:docker"

  client:
    build:
      context: ../D365FOMiddleware_Client
      dockerfile: Dockerfile
    container_name: d365fo-middleware-client
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ../D365FOMiddleware_Client/src:/app/src
      - ../D365FOMiddleware_Client/public:/app/public
      - ../D365FOMiddleware_Client/package.json:/app/package.json
      - ../D365FOMiddleware_Client/vite.config.js:/app/vite.config.js
      - ../D365FOMiddleware_Client/.env:/app/.env
      - client-node_modules-dev:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - mongodb_network
      - redis_network

  mongodb:
    image: mongodb/mongodb-community-server:8.0.4-ubi8
    container_name: mongodb-dev
    restart: unless-stopped
    hostname: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: sp3awi
    volumes:
      - mongodb-data-dev:/data/db
      # Image declares VOLUME /data/configdb; name it to avoid anonymous orphans
      - mongodb-configdb-dev:/data/configdb
    networks:
      - mongodb_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username root --password sp3awi --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    hostname: redis
    restart: unless-stopped
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
      else
        redis-server --appendonly yes
      fi
      "
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data-dev:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  cache-redis:
    image: redis:7-alpine
    container_name: cache-redis-dev
    hostname: cache-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '${CACHE_REDIS_MAX_MEMORY:-256mb}',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    # Image declares VOLUME /data; name it so recreate does not orphan anonymous volumes
    volumes:
      - cache-redis-data-dev:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongodb-data-dev:
    driver: local
  mongodb-configdb-dev:
    driver: local
  redis-data-dev:
    driver: local
  cache-redis-data-dev:
    driver: local
  node_modules-dev:
    driver: local
  client-node_modules-dev:
    driver: local

networks:
  mongodb_network:
    driver: bridge
    name: mongo-network
  redis_network:
    driver: bridge
    name: redis-network
