services:
  postgres:
    image: postgres:16
    container_name: mg_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sp3awi
      POSTGRES_DB: MGD365FOMiddlewareDB
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mg_network

volumes:
  postgres_data:

networks:
  mg_network:
