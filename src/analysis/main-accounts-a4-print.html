<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Accounts - أوراق</title>
  <style>
    @page {
      size: A4;
      margin: 12mm;
    }

    :root {
      --border: #000;
      --text: #000;
      --bg: #fff;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.4;
    }

    .page {
      width: 100%;
      max-width: 190mm;
      margin: 0 auto;
      padding: 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      padding: 6px 8px;
    }

    .table-wrap {
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    thead th {
      border-bottom: 1px solid var(--border);
      border-left: 1px solid var(--border);
      padding: 6px 8px;
      text-align: center;
      font-weight: 700;
      background: #fff;
    }

    thead th:last-child,
    tbody td:last-child {
      border-left: none;
    }

    tbody td {
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
      padding: 5px 8px;
      vertical-align: top;
      background: #fff;
      word-break: break-word;
    }

    .col-index {
      width: 7%;
      text-align: center;
    }

    .col-account {
      width: 12%;
      text-align: center;
      direction: ltr;
    }

    .col-name {
      width: 46%;
      text-align: right;
    }

    .col-chart {
      width: 17%;
      text-align: center;
      direction: ltr;
    }

    .col-map {
      width: 18%;
      text-align: center;
      direction: ltr;
    }

    .actions {
      margin: 10px 0 0;
      text-align: center;
    }

    .print-btn {
      border: 1px solid #000;
      background: #fff;
      color: #000;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    @media print {
      .actions {
        display: none;
      }
    }
  </style>
</head>
