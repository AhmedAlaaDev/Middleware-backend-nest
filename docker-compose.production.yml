# docker-compose.production.yml
services:
  app:
    image: moatazali/middleware-app:1.0.2
    container_name: d365fo-middleware-production
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    environment:
      NODE_ENV: production
    networks:
      - mongodb_network
      - redis_network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:${PORT:-3001}/docs', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 2g
    cpus: 1.0

  mongodb:
    image: mongodb/mongodb-community-server:8.0.4-ubi8
    container_name: mongodb
    restart: unless-stopped
    hostname: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: sp3awi
    volumes:
      - mongodb-data:/data/db
    networks:
      - mongodb_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username root --password sp3awi --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
      else
        redis-server --appendonly yes
      fi
      "
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    cpus: 0.5

volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  mongodb-log:
    driver: local
    name: mongo-log
  redis-data:
    driver: local
    name: redis-data

networks:
  mongodb_network:
    driver: bridge
    name: mongo-network
  redis_network:
    driver: bridge
    name: redis-network
