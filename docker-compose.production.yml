# docker-compose.production.yml
services:
  app:
    image: moatazali/middleware-app:1.0.18
    container_name: d365fo-middleware-production
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:${PORT:-3001}:${PORT:-3001}'
    # Prefer IPv4 because some Docker hosts resolve Microsoft to IPv6 without an outbound IPv6 route.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-6144} --dns-result-order=ipv4first'
      CACHE_REDIS_HOST: cache-redis
    networks:
      - mongodb_network
      - redis_network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:${PORT:-3001}/api/v1/health/ready', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: '${APP_MEMORY_LIMIT:-8g}'
    cpus: '${APP_CPU_LIMIT:-2.0}'
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

  mongodb:
    image: mongodb/mongodb-community-server:8.0.4-ubi8
    container_name: mongodb
    restart: unless-stopped
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: sp3awi
    volumes:
      - mongodb-data:/data/db
      # Image declares VOLUME /data/configdb; name it to avoid anonymous orphans
      - mongodb-configdb:/data/configdb
    networks:
      - mongodb_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username root --password sp3awi --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
      else
        redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
      fi
      "
    volumes:
      - redis-data:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    cpus: 0.5

  cache-redis:
    image: redis:7-alpine
    container_name: cache-redis
    hostname: cache-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '${CACHE_REDIS_MAX_MEMORY:-512mb}',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - cache-redis-data:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: '${CACHE_REDIS_MEMORY_LIMIT:-768m}'
    cpus: 0.5

volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  mongodb-configdb:
    driver: local
    name: mongo-configdb
  redis-data:
    driver: local
    name: redis-data
  cache-redis-data:
    driver: local
    name: cache-redis-data

networks:
  mongodb_network:
    driver: bridge
    name: mongo-network
  redis_network:
    driver: bridge
    name: redis-network
