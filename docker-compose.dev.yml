# docker-compose.dev.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: d365fo-middleware-dev
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - '${PORT:-3000}:3000'
    environment:
      # Application Configuration
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      PREFIX: ${PREFIX:-}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-*}

      # Database Configuration
      MONGODB_URI: ${MONGODB_URI:-mongodb://root:sp3awi@mongodb:27017/d365fo?authSource=admin}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-5}

      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_MAX_RETRIES_PER_REQUEST: ${REDIS_MAX_RETRIES_PER_REQUEST:-3}
      REDIS_ENABLE_READY_CHECK: ${REDIS_ENABLE_READY_CHECK:-true}
      REDIS_LAZY_CONNECT: ${REDIS_LAZY_CONNECT:-false}

      # Authentication Configuration
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15d}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mg-d365fo-middleware}
      JWT_ISSUER: ${JWT_ISSUER:-mg-d365fo-middleware}

      # D365FO Configuration - loaded from env_file (.env.development)
      # These are not set here to allow env_file to take precedence

      # Resilience Configuration
      CIRCUIT_BREAKER_TIMEOUT: ${CIRCUIT_BREAKER_TIMEOUT:-120000}
      CIRCUIT_BREAKER_RESET_TIMEOUT: ${CIRCUIT_BREAKER_RESET_TIMEOUT:-30000}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENTAGE: ${CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENTAGE:-50}
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-true}
      CACHE_L1_TTL: ${CACHE_L1_TTL:-5}
      CACHE_L2_TTL: ${CACHE_L2_TTL:-30}
      CACHE_L3_TTL: ${CACHE_L3_TTL:-120}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
      # Exclude node_modules from volume mount
      - /app/node_modules
    networks:
      - mongodb_network
      - redis_network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm run start:dev

  mongodb:
    image: mongodb/mongodb-community-server:8.0.4-ubi8
    container_name: mongodb-dev
    restart: unless-stopped
    hostname: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: sp3awi
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - mongodb_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username root --password sp3awi --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    hostname: redis
    restart: unless-stopped
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
      else
        redis-server --appendonly yes
      fi
      "
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data-dev:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongodb-data-dev:
    driver: local
  mongodb-log-dev:
    driver: local
  redis-data-dev:
    driver: local

networks:
  mongodb_network:
    driver: bridge
    name: mongo-network
  redis_network:
    driver: bridge
    name: redis-network
