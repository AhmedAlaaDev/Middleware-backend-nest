# docker-compose.dev.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: d365fo-middleware-dev
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
      # Exclude node_modules from volume mount
      - /app/node_modules
    networks:
      - mongodb_network
      - redis_network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd /app && pnpm start:dev"

  mongodb:
    image: mongodb/mongodb-community-server:8.0.4-ubi8
    container_name: mongodb-dev
    restart: unless-stopped
    hostname: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: sp3awi
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - mongodb_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username root --password sp3awi --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    hostname: redis
    restart: unless-stopped
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
      else
        redis-server --appendonly yes
      fi
      "
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data-dev:/data
    networks:
      - redis_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongodb-data-dev:
    driver: local
  mongodb-log-dev:
    driver: local
  redis-data-dev:
    driver: local

networks:
  mongodb_network:
    driver: bridge
    name: mongo-network
  redis_network:
    driver: bridge
    name: redis-network
